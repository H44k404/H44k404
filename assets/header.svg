<svg fill="none" viewBox="0 0 900 170" width="900" height="170" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          box-sizing: border-box;
          background: #0d1117;
          border: 1px solid #30363d;
          border-radius: 8px;
          padding: 24px 32px;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
          color: #c9d1d9;
          display: flex;
          flex-direction: column;
          justify-content: center;
          height: 170px;
        }
        .header-top {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 8px;
        }
        .status-dot {
          width: 8px;
          height: 8px;
          background: #2ea043;
          border-radius: 50%;
          box-shadow: 0 0 8px rgba(46, 160, 67, 0.6);
        }
        .title {
          font-size: 26px;
          font-weight: 700;
          color: #f0f6fc;
          letter-spacing: -0.5px;
          margin: 0;
        }
        .handle {
          font-size: 14px;
          color: #8b949e;
          font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
          background: #161b22;
          padding: 3px 8px;
          border: 1px solid #30363d;
          border-radius: 6px;
        }
        .subtitle {
          font-size: 14px;
          color: #58a6ff;
          margin: 4px 0 0 0;
          font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
          letter-spacing: 0.5px;
        }
        .tags {
          display: flex;
          gap: 8px;
          margin-top: 14px;
          font-size: 12px;
          font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        }
        .tag {
          color: #8b949e;
          background: #161b22;
          border: 1px solid #21262d;
          border-radius: 4px;
          padding: 3px 10px;
        }
        .tag span {
          color: #79c0ff;
        }
      </style>
      <div class="container">
        <div class="header-top">
          <div class="status-dot"></div>
          <h1 class="title">Kalana Vimukthi</h1>
          <span class="handle">H44k404</span>
        </div>
        <p class="subtitle">SOFTWARE ENGINEER • FULL-STACK &amp; SYSTEMS ARCHITECTURE</p>
        <div class="tags">
          <div class="tag">status: <span>online</span></div>
          <div class="tag">focus: <span>scalable-systems</span></div>
          <div class="tag">location: <span>remote / global</span></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
